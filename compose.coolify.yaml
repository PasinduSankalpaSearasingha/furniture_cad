# Coolify deployment. Same stack as compose.yaml, adapted for a shared Coolify host:
# - no host ports: Coolify's proxy routes the domain to api:8000 over the Docker network
# - no YAML anchors: Coolify's compose parser is unreliable with them
# - SERVICE_PASSWORD_POSTGRES is a Coolify magic variable (auto-generated password)
# - no login: LOCAL_WORKSPACE=1 + PUBLIC_WORKSPACE=1 open one shared workspace to anyone with the URL
# - the domain is set by hand in Coolify on the api service, e.g. https://fraugment.com:8000
# In Coolify: Build Pack = Docker Compose, Docker Compose Location = /compose.coolify.yaml

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: furniture
      POSTGRES_DB: furniture
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U furniture -d furniture"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: [alembic, upgrade, head]
    environment:
      DATABASE_URL: postgresql+psycopg://furniture:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/furniture
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /srv/artifacts
      JOB_EXECUTOR: celery
      LOCAL_WORKSPACE: ${LOCAL_WORKSPACE:-1}
      PUBLIC_WORKSPACE: ${PUBLIC_WORKSPACE:-1}
    volumes:
      - artifacts:/srv/artifacts
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    exclude_from_hc: true

  api:
    build: .
    # Trust Coolify's proxy so the app sees https://fraugment.com, not http://<container>
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --log-level, info, --proxy-headers, --forwarded-allow-ips, '*']
    environment:
      DATABASE_URL: postgresql+psycopg://furniture:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/furniture
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /srv/artifacts
      JOB_EXECUTOR: celery
      LOCAL_WORKSPACE: ${LOCAL_WORKSPACE:-1}
      PUBLIC_WORKSPACE: ${PUBLIC_WORKSPACE:-1}
      AI_ENABLED: ${AI_ENABLED:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REASONING_MODEL: ${OPENAI_REASONING_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-high}
      OPENAI_PHOTO_DESIGN_MODEL: ${OPENAI_PHOTO_DESIGN_MODEL:-}
      OPENAI_PHOTO_REVIEW_MODEL: ${OPENAI_PHOTO_REVIEW_MODEL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-90}
      OPENAI_BACKGROUND_MODE: ${OPENAI_BACKGROUND_MODE:-1}
      OPENAI_POLL_INTERVAL_SECONDS: ${OPENAI_POLL_INTERVAL_SECONDS:-2}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-6000}
      AI_PHOTO_MAX_OUTPUT_TOKENS: ${AI_PHOTO_MAX_OUTPUT_TOKENS:-28000}
      AI_PHOTO_TIMEOUT_SECONDS: ${AI_PHOTO_TIMEOUT_SECONDS:-600}
      AI_PHOTO_REASONING_EFFORT: ${AI_PHOTO_REASONING_EFFORT:-medium}
      AI_FURNITURE_BUDGET_USD: ${AI_FURNITURE_BUDGET_USD:-2.00}
      CAD_OPTIMIZER_ENABLED: ${CAD_OPTIMIZER_ENABLED:-1}
      CAD_OPTIMIZER_MODE: ${CAD_OPTIMIZER_MODE:-balanced}
      CAD_OPTIMIZER_MAX_SECONDS: ${CAD_OPTIMIZER_MAX_SECONDS:-600}
      CAD_FINAL_CORRECTION_ENABLED: ${CAD_FINAL_CORRECTION_ENABLED:-1}
    volumes:
      - artifacts:/srv/artifacts
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: [celery, -A, app.jobs.celery_app, worker, --loglevel=INFO, --concurrency=1, -Q, 'celery,renders']
    environment:
      DATABASE_URL: postgresql+psycopg://furniture:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/furniture
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /srv/artifacts
      JOB_EXECUTOR: celery
      LOCAL_WORKSPACE: ${LOCAL_WORKSPACE:-1}
      PUBLIC_WORKSPACE: ${PUBLIC_WORKSPACE:-1}
      AI_ENABLED: ${AI_ENABLED:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REASONING_MODEL: ${OPENAI_REASONING_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-high}
      OPENAI_PHOTO_DESIGN_MODEL: ${OPENAI_PHOTO_DESIGN_MODEL:-}
      OPENAI_PHOTO_REVIEW_MODEL: ${OPENAI_PHOTO_REVIEW_MODEL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-90}
      OPENAI_BACKGROUND_MODE: ${OPENAI_BACKGROUND_MODE:-1}
      OPENAI_POLL_INTERVAL_SECONDS: ${OPENAI_POLL_INTERVAL_SECONDS:-2}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-6000}
      AI_PHOTO_MAX_OUTPUT_TOKENS: ${AI_PHOTO_MAX_OUTPUT_TOKENS:-28000}
      AI_PHOTO_TIMEOUT_SECONDS: ${AI_PHOTO_TIMEOUT_SECONDS:-600}
      AI_PHOTO_REASONING_EFFORT: ${AI_PHOTO_REASONING_EFFORT:-medium}
      AI_FURNITURE_BUDGET_USD: ${AI_FURNITURE_BUDGET_USD:-2.00}
      CAD_OPTIMIZER_ENABLED: ${CAD_OPTIMIZER_ENABLED:-1}
      CAD_OPTIMIZER_MODE: ${CAD_OPTIMIZER_MODE:-balanced}
      CAD_OPTIMIZER_MAX_SECONDS: ${CAD_OPTIMIZER_MAX_SECONDS:-600}
      CAD_FINAL_CORRECTION_ENABLED: ${CAD_FINAL_CORRECTION_ENABLED:-1}
    volumes:
      - artifacts:/srv/artifacts
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, celery, -A, app.jobs.celery_app, inspect, ping, --timeout=5]
      interval: 60s
      timeout: 20s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  artifacts:
