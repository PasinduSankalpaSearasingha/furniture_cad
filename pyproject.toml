[project]
name = "furniture-manufacturing-starter"
version = "0.3.0"
description = "Revision-controlled cabinet CAD and manufacturing engineering review"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.119.1",
  "uvicorn==0.38.0",
  "pydantic==2.12.3",
  "cadquery==2.6.1",
  "ezdxf==1.4.2",
  "sqlalchemy==2.0.44",
  "alembic==1.17.0",
  "celery==5.5.3",
  "redis==6.4.0",
  "psycopg[binary]==3.2.12",
  "openpyxl==3.1.5",
  "reportlab==4.4.4",
  "openai==3.12.0",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "pillow>=11,<14",
  "opencv-python-headless>=4.13,<4.14",
  "scipy==1.16.2",
  "trimesh==4.9.0",
  "open3d==0.19.0",
  "psutil==7.1.3",
  "build123d==0.10.0",
  "ocp-gordon==0.1.17",
  "svglib==1.5.1",
  "pypdf==6.1.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "trimesh==4.9.0", "pypdf==6.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:cadquery.*"]

[tool.uv]
package = false
